name: Diagnose AWS OIDC Role

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC token claims (without printing the token)
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq --exit-status --raw-output '.value' <<< "$response")"
          payload="${token#*.}"
          payload="${payload%%.*}"

          case $((${#payload} % 4)) in
            2) payload+="==" ;;
            3) payload+="=" ;;
            1)
              echo "::error::Received an invalid OIDC token payload."
              exit 1
              ;;
          esac

          claims="$(printf '%s' "$payload" | tr '_-' '/+' | base64 --decode)"
          jq '{iss, aud, sub, repository, ref}' <<< "$claims"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-oidc-diagnostic
          retry-max-attempts: 1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
