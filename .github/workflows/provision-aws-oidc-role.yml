name: Deploy GitHub OIDC Provider

on:
  workflow_dispatch:
    inputs:
      stack_name:
        required: true
        default: github-oidc
        description: CloudFormation Stack Name
      oidc_provider_arn:
        required: false
        description: Existing GitHub OIDC provider ARN if any.
        default: ""
      role_name:
        required: true
        default: GitHubOIDCRole
        description: IAM Role name to create for GitHub OIDC access
      aws_managed_policy_arns:
        required: true
        default: arn:aws:iam::aws:policy/AdministratorAccess
        description: Comma-separated managed policy ARNs to attach.
      github_org:
        required: true
        description: GitHub org/user allowed to assume the role
      github_repo:
        required: true
        description: GitHub repo allowed to assume the role (* explicitly allows all repos in the org)
      github_subject:
        required: true
        default: ref:refs/heads/main
        description: OIDC subject suffix, such as ref:refs/heads/main or environment:production
permissions:
  contents: read

jobs:
  access-policy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Check for AdministratorAccess
        id: check
        env:
          ROLE_MANAGED_POLICY_ARNS: ${{ inputs.aws_managed_policy_arns }}
        run: |
          if printf '%s' "$ROLE_MANAGED_POLICY_ARNS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -Eq ':policy/AdministratorAccess$'; then
            echo "::warning::AdministratorAccess is selected (the workflow default). This policy grants full AWS account access."
            {
              echo "### ⚠️ AdministratorAccess policy selected"
              echo "The selected policy grants full AWS account access. Review the policy choice before proceeding; use a narrower policy when possible."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-oidc:
    needs: access-policy-notice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://cfn/github-oidc.yaml

      - name: Deploy stack
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          OIDC_PROVIDER_ARN: ${{ inputs.oidc_provider_arn }}
          ROLE_NAME: ${{ inputs.role_name }}
          ROLE_MANAGED_POLICY_ARNS: ${{ inputs.aws_managed_policy_arns }}
          GITHUB_ORG: ${{ inputs.github_org }}
          GITHUB_REPO: ${{ inputs.github_repo }}
          GITHUB_SUBJECT: ${{ inputs.github_subject }}
        run: |
          aws cloudformation deploy --template-file cfn/github-oidc.yaml --stack-name "$STACK_NAME" --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ExistingOidcProviderArn="$OIDC_PROVIDER_ARN" \
              RoleName="$ROLE_NAME" \
              RoleManagedPolicyArns="$ROLE_MANAGED_POLICY_ARNS" \
              GitHubOrg="$GITHUB_ORG" \
              GitHubRepo="$GITHUB_REPO" \
              GitHubSubject="$GITHUB_SUBJECT"

      - name: Get stack outputs (ARNs)
        id: outputs
        env:
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          get() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          PROVIDER_ARN_REDACTED=$(printf '%s' "$(get OIDCProviderArn)" | sed -E 's/::[0-9]{12}:/::************:/')
          ROLE_ARN_REDACTED=$(printf '%s' "$(get RoleArn)" | sed -E 's/::[0-9]{12}:/::************:/')

          {
            echo "### Deployment Outputs"
            echo "- **OIDC Provider ARN:** \`$PROVIDER_ARN_REDACTED\`"
            echo "- **Role ARN:** \`$ROLE_ARN_REDACTED\`"
            echo
            echo "The 12-digit AWS account ID is redacted. Retrieve full ARNs from the CloudFormation stack Outputs."
          } >> "$GITHUB_STEP_SUMMARY"