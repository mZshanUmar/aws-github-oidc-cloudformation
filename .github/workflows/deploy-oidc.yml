name: Deploy GitHub OIDC Provider

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      stack_name:
        description: CloudFormation stack name
        required: true
        default: github-oidc
      github_org:
        description: GitHub org/user allowed to assume the role
        required: true
      github_repo:
        description: GitHub repo allowed to assume the role (* explicitly allows all repos in the org)
        required: true
      existing_oidc_provider_arn:
        description: Optional existing GitHub OIDC provider ARN; leave blank to create one
        required: false
        default: ""
      github_subject:
        description: OIDC subject suffix, such as ref:refs/heads/main or environment:production
        required: true
        default: ref:refs/heads/main
      role_name:
        description: IAM role name
        required: true
        default: github-actions-oidc-role
      role_managed_policy_arns:
        description: Comma-separated managed policy ARNs to attach (for example EC2 Full + S3 Read)
        required: true
        default: arn:aws:iam::aws:policy/AdministratorAccess
      role_session_duration_minutes:
        description: Requested AWS session duration in minutes (15-720)
        type: number
        required: true
        default: 60

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keys come from repo Settings > Secrets and variables > Actions.
      # Never pass keys as workflow inputs: inputs are visible in plain text.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://cfn/github-oidc.yaml

      - name: Warn about AdministratorAccess
        env:
          ROLE_MANAGED_POLICY_ARNS: ${{ inputs.role_managed_policy_arns }}
        run: |
          if printf '%s' "$ROLE_MANAGED_POLICY_ARNS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -Eq ':policy/AdministratorAccess$'; then
            echo "::warning::AdministratorAccess grants full AWS account permissions. Use only if required."
            echo "### ⚠️ AdministratorAccess selected" >> "$GITHUB_STEP_SUMMARY"
            echo "This grants full AWS account permissions." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy stack
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          GITHUB_ORG: ${{ inputs.github_org }}
          GITHUB_REPO: ${{ inputs.github_repo }}
          EXISTING_OIDC_PROVIDER_ARN: ${{ inputs.existing_oidc_provider_arn }}
          GITHUB_SUBJECT: ${{ inputs.github_subject }}
          ROLE_NAME: ${{ inputs.role_name }}
          ROLE_MANAGED_POLICY_ARNS: ${{ inputs.role_managed_policy_arns }}
          ROLE_SESSION_DURATION_MINUTES: ${{ inputs.role_session_duration_minutes }}
        run: |
          if ! [[ "$ROLE_SESSION_DURATION_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::Session duration must be a whole number of minutes."
            exit 1
          fi
          if [ "$ROLE_SESSION_DURATION_MINUTES" -lt 15 ] || [ "$ROLE_SESSION_DURATION_MINUTES" -gt 720 ]; then
            echo "::error::Session duration must be between 15 and 720 minutes."
            exit 1
          fi

          role_session_duration_seconds=$((ROLE_SESSION_DURATION_MINUTES * 60))
          role_max_session_duration_seconds=$role_session_duration_seconds
          if [ "$role_max_session_duration_seconds" -lt 3600 ]; then
            role_max_session_duration_seconds=3600
          fi

          aws cloudformation deploy \
            --template-file cfn/github-oidc.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              GitHubOrg="$GITHUB_ORG" \
              GitHubRepo="$GITHUB_REPO" \
              ExistingOIDCProviderArn="$EXISTING_OIDC_PROVIDER_ARN" \
              GitHubSubject="$GITHUB_SUBJECT" \
              RoleName="$ROLE_NAME" \
              RoleManagedPolicyArns="$ROLE_MANAGED_POLICY_ARNS" \
              RoleMaxSessionDurationSeconds="$role_max_session_duration_seconds"

          {
            echo "- **Requested AWS session duration:** ${ROLE_SESSION_DURATION_MINUTES} minutes"
            echo "- **IAM role maximum session duration:** ${role_max_session_duration_seconds} seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get stack outputs (ARNs)
        id: outputs
        run: |
          get() {
            aws cloudformation describe-stacks \
              --stack-name "${{ inputs.stack_name }}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          PROVIDER_ARN=$(get OIDCProviderArn)
          ROLE_ARN=$(get RoleArn)

          echo "::add-mask::$PROVIDER_ARN"
          echo "::add-mask::$ROLE_ARN"
          echo "OIDC provider and IAM role deployed successfully."
