AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC identity provider and IAM role

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or username (e.g. my-org)
  GitHubRepo:
    Type: String
    Description: Repository name; set * to allow all repos in the org
  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub OIDC provider ARN; leave empty to create one
  GitHubSubject:
    Type: String
    Default: ref:refs/heads/main
    Description: OIDC subject suffix, such as ref:refs/heads/main or environment:production
  RoleName:
    Type: String
    Default: github-actions-oidc-role
  RoleManagedPolicyArns:
    Type: CommaDelimitedList
    Default: arn:aws:iam::aws:policy/AdministratorAccess
    Description: Comma-separated managed policy ARNs attached to the role
  RoleMaxSessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Maximum role session duration in seconds (1 to 12 hours)

Conditions:
  CreateOIDCProvider: !Equals [!Ref ExistingOIDCProviderArn, ""]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # Thumbprint is no longer required for GitHub; AWS validates via its trusted CA library.

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      ManagedPolicyArns: !Ref RoleManagedPolicyArns
      MaxSessionDuration: !Ref RoleMaxSessionDurationSeconds
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:${GitHubSubject}"

Outputs:
  OIDCProviderArn:
    Description: ARN of the created or reused GitHub OIDC provider
    Value: !If
      - CreateOIDCProvider
      - !Ref GitHubOIDCProvider
      - !Ref ExistingOIDCProviderArn
    Export:
      Name: !Sub "${AWS::StackName}-OIDCProviderArn"
  RoleArn:
    Description: ARN of the role GitHub Actions can assume
    Value: !GetAtt GitHubActionsRole.Arn
