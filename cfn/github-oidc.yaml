AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC identity provider and IAM role

Parameters:
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub OIDC provider ARN, if any; leave blank to create a new provider
  RoleName:
    Type: String
  RoleManagedPolicyArns:
    Type: CommaDelimitedList
    Description: Comma-separated managed policy ARNs attached to the role
  GitHubOrg:
    Type: String
    Description: GitHub organization or username (e.g. my-org)
  GitHubRepo:
    Type: String
    Description: Repository name; set * to allow all repos in the org
  GitHubSubject:
    Type: String
    Description: OIDC subject suffix, such as ref:refs/heads/main or environment:production

Conditions:
  CreateOIDCProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # Thumbprint is no longer required for GitHub; AWS validates via its trusted CA library.

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      ManagedPolicyArns: !Ref RoleManagedPolicyArns
      # IAM role maximum session duration has a 1-hour minimum; adjust between 1-hour(3600sec) to 12-hour(43200sec) as needed.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:${GitHubSubject}"

Outputs:
  OIDCProviderArn:
    Description: ARN of the created or reused GitHub OIDC provider
    Value: !If
      - CreateOIDCProvider
      - !Ref GitHubOIDCProvider
      - !Ref ExistingOidcProviderArn
  RoleArn:
    Description: ARN of the role GitHub Actions can assume
    Value: !GetAtt GitHubActionsRole.Arn