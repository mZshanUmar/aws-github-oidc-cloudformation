AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC identity provider and IAM role

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or username (e.g. my-org)
  GitHubRepo:
    Type: String
    Description: Repository name; set * to allow all repos in the org
  GitHubSubject:
    Type: String
    Default: ref:refs/heads/main
    Description: OIDC subject suffix, such as ref:refs/heads/main or environment:production
  RoleName:
    Type: String
    Default: github-actions-oidc-role
  RoleManagedPolicyArns:
    Type: CommaDelimitedList
    Default: arn:aws:iam::aws:policy/AdministratorAccess
    Description: Comma-separated managed policy ARNs attached to the role

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # Thumbprint is no longer required for GitHub; AWS validates via its trusted CA library.

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      ManagedPolicyArns: !Ref RoleManagedPolicyArns
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider   # Ref returns the provider ARN
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:${GitHubSubject}"

Outputs:
  OIDCProviderArn:
    Description: ARN of the GitHub OIDC provider
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: !Sub "${AWS::StackName}-OIDCProviderArn"
  RoleArn:
    Description: ARN of the role GitHub Actions can assume
    Value: !GetAtt GitHubActionsRole.Arn
